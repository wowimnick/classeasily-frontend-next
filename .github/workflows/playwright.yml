name: Playwright E2E on Vercel Preview

# 1. Listen for Vercel telling GitHub "I finished deploying!"
on:
  deployment_status:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # 2. Only run if deployment succeeded AND it is a Preview (Pull Request)
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Preview'
    
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20 # Match your Vercel Node version
        
    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test
      env:
        # 3. This is the magic. We inject the dynamic Vercel URL into Playwright.
        PLAYWRIGHT_TEST_BASE_URL: ${{ github.event.deployment_status.target_url }}
        # Pass other public env vars if needed for the build to finish, 
        # but usually not needed just to run tests against a remote URL.